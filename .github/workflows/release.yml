name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
      - name: Build LSP
        run: cargo build --release --target ${{ matrix.target }} --manifest-path lsp/Cargo.toml
      - name: Build gum-nix
        run: cargo build --release --target ${{ matrix.target }} --manifest-path nix-generator/Cargo.toml
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/gum dist/
          cp target/${{ matrix.target }}/release/gum-lsp dist/
          cp target/${{ matrix.target }}/release/gum-nix dist/
          tar -czf gum-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/gum.exe dist/
          cp target/${{ matrix.target }}/release/gum-lsp.exe dist/
          cp target/${{ matrix.target }}/release/gum-nix.exe dist/
          7z a gum-${{ github.ref_name }}-${{ matrix.target }}.zip dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: gum-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Publish Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gum-*.tar.gz
            gum-*.zip
          generate_release_notes: true
