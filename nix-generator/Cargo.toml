[package]
name = "gum-nix"
version = "0.1.0"
edition = "2021"
description = "Generate Nix source expressions from Gum markup config files — an nvfetcher alternative"
license = "MIT"

[[bin]]
name = "gum-nix"
path = "src/main.rs"

[dependencies]
gum-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
glob = "0.3"
sha2 = "0.10"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
semver = "1.0"
